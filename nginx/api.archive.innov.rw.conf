# RCA Archive API — api.archive.innov.rw

server {
    listen 80;
    listen [::]:80;
    server_name api.archive.innov.rw;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.archive.innov.rw;

    ssl_certificate     /etc/letsencrypt/live/api.archive.innov.rw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.archive.innov.rw/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/api.archive.innov.rw.access.log;
    error_log  /var/log/nginx/api.archive.innov.rw.error.log;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5009;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    86400s;
    }
}
