# RCA Archive frontend — rcaarchive.innov.rw
# Serves the React build. API calls go to https://api.archive.innov.rw (configured in src/config.js).

server {
    listen 80;
    listen [::]:80;
    server_name rcaarchive.innov.rw;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rcaarchive.innov.rw;

    ssl_certificate     /etc/letsencrypt/live/rcaarchive.innov.rw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rcaarchive.innov.rw/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/apps/rca_archive/frontend;
    index index.html;

    access_log /var/log/nginx/rcaarchive.innov.rw.access.log;
    error_log  /var/log/nginx/rcaarchive.innov.rw.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
