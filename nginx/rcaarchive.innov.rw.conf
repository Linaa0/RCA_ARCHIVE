# RCA Archive frontend: rcaarchive.innov.rw
# Serves the React build. API calls go to https://api.archive.innov.rw (configured via VITE_API_URL).

server {
    listen 80;
    listen [::]:80;
    server_name rcaarchive.innov.rw;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rcaarchive.innov.rw;

    ssl_certificate     /etc/letsencrypt/live/rcaarchive.innov.rw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rcaarchive.innov.rw/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/apps/rca_archive/client/dist;
    index index.html;

    access_log /var/log/nginx/rcaarchive.innov.rw.access.log;
    error_log  /var/log/nginx/rcaarchive.innov.rw.error.log;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://* wss://*; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
