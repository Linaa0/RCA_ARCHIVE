name: Security Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rca-archive-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 5078
      MONGO_URI: mongodb://127.0.0.1:27017/rca_security_test
      MONGO_DB_NAME: rca_security_test
      JWT_SECRET: e09f87b8d009b119a9d7bb3ef20a597bf681c62f2df3e0d86b72f10b02447990
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      BASE_URL: http://localhost:5078
      FRONTEND_BASE_URL: http://localhost:3074
      MAIL_PROVIDER: stub
      EMAIL_FROM: RCA Archive <noreply@archive.innov.rw>

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Dependencies
        run: |
          cd server
          npm ci
          cd ../client
          npm ci

      - name: Run Security Regression Test Suite
        run: |
          cd server
          node --test test/part1Security.test.js
          node --test test/part2Sessions.test.js
          node --test test/part3RateLimit.test.js
          node --test test/part4UploadValidation.test.js
