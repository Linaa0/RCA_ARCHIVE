name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: rca-archive-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    env:
      NODE_ENV: test
      PORT: 5077
      MONGO_URI: mongodb://127.0.0.1:27017/rca_past_papers_test
      MONGO_DB_NAME: rca_past_papers_test
      JWT_SECRET: e09f87b8d009b119a9d7bb3ef20a597bf681c62f2df3e0d86b72f10b02447990
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      MAIL_PROVIDER: smtp
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_USER: test-smtp-user
      SMTP_PASS: test-smtp-password
      EMAIL_FROM: RCA Archive <noreply@archive.innov.rw>

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package.json
            client/package.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Server Test Suite
        run: |
          cd server
          npm test

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Client Bundle
        run: |
          cd client
          npm run build
