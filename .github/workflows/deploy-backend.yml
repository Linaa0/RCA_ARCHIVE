name: Deployment CI/CD OF  RCA Archive Backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "scripts/deploy-backend.sh"
      - "server/ecosystem.config.cjs"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: rca-archive-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      NPM_CONFIG_FETCH_RETRIES: 5
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
      NPM_CONFIG_MAXSOCKETS: 3
      RCA_ARCHIVE_APP_DIR: /opt/apps/rca_archive
      RCA_ARCHIVE_CONFIG_ENV: /opt/configs/rca_archive/.env
      RCA_ARCHIVE_PM2_NAME: rca-archive-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy backend to /opt/apps/rca_archive
        run: chmod +x scripts/deploy-backend.sh && bash scripts/deploy-backend.sh

      - name: Health check
        run: |
          ENV_FILE="/opt/configs/rca_archive/.env"
          PORT=$(grep -E '^PORT=' "$ENV_FILE" | tail -1 | cut -d= -f2- | tr -d ' \r"'"'"'' | sed 's/#.*//')
          if ! [[ "$PORT" =~ ^[0-9]+$ ]]; then
            PORT=5009
          fi

          URL="http://127.0.0.1:${PORT}/api/health"
          echo "Checking ${URL} and /api/curriculum (up to 180s)..."

          for i in $(seq 1 60); do
            HEALTH_RAW=$(curl -s --connect-timeout 5 --max-time 20 "$URL" 2>/dev/null || true)
            HEALTH_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 20 "$URL" 2>/dev/null || true)
            CURR_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 20 "http://127.0.0.1:${PORT}/api/curriculum" 2>/dev/null || true)
            RETURNED_COMMIT=$(echo "$HEALTH_RAW" | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                try { const j=JSON.parse(s); console.log(j.commit||""); } catch { console.log(""); }
              });' 2>/dev/null || true)

            COMMIT_OK=0
            if [[ -z "${GITHUB_SHA:-}" || "$RETURNED_COMMIT" == "$GITHUB_SHA" ]]; then
              COMMIT_OK=1
            fi

            if [[ "$HEALTH_CODE" == "200" && "$CURR_CODE" == "200" && "$COMMIT_OK" -eq 1 ]]; then
              echo "Health check OK on port ${PORT} (commit: ${RETURNED_COMMIT})"
              exit 0
            fi
            echo "Waiting for API... (${i}/60, health=${HEALTH_CODE}, curriculum=${CURR_CODE}, commit=${RETURNED_COMMIT})"
            sleep 3
          done

          echo "Health check failed after 180s"
          echo "--- Port Listener Info ---"
          raw=$(ss -ltnp "sport = :${PORT}" 2>/dev/null || ss -ltnp 2>/dev/null | grep -E ":${PORT}\b" || true)
          proc=$(echo "$raw" | sed -nE 's/.*users:\(\("([^"]+)".*/\1/p' | head -n1)
          pid=$(echo "$raw" | sed -nE 's/.*pid=([0-9]+).*/\1/p' | head -n1)
          user=""
          if [[ -n "$pid" ]]; then
            user=$(ps -o user= -p "$pid" 2>/dev/null | tr -d ' ' || true)
            if [[ -z "$proc" ]]; then
              proc=$(ps -o comm= -p "$pid" 2>/dev/null | tr -d ' ' || true)
            fi
          fi
          if [[ -n "$proc" && -n "$user" ]]; then
            echo "Port ${PORT} listener: user=${user} process=${proc}"
          elif [[ -n "$proc" ]]; then
            echo "Port ${PORT} listener: process=${proc}"
          else
            echo "Port ${PORT} listener: not available"
          fi
          exit 1
